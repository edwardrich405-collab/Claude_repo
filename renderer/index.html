<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src blob:"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Allison Assistant</title>
<style>
/* Layout: one infinite, pannable canvas. Allison is a particle system that lives on the canvas and flies to whatever panel she opens.
   Fixed chrome: left tab rail, top status, bottom voice bar with captions, zoom controls. Apple-style liquid glass, dark by default with a light mode. */
/* Layout: an ASCII ocean drawn in WebGL, a half-sunk boat bobbing in the middle, and Allie, a pink gull, perched on it.
   Tabs open as glass panels standing just above the water around the boat; the camera sails between them.
   The only fixed controls: sleep (top left), chat and the thinking indicator (bottom). Dark by default with a light mode. */
:root{
  color-scheme: dark;
  --bg:#051416; --sea-glow:rgba(120,230,205,.10);
  --mat:rgba(14,38,42,.78); --mat-strong:rgba(12,32,36,.94);
  --panel-a:rgba(24,56,60,.80); --panel-b:rgba(8,26,30,.88); --panel-rim:rgba(165,235,220,.17); --panel-hi:rgba(210,255,245,.10);
  --hair:rgba(170,230,218,.11); --hair-strong:rgba(170,230,218,.22);
  --label:#e2f4ef; --label-2:rgba(205,232,226,.66); --label-3:rgba(205,232,226,.40);
  --fill:rgba(140,210,200,.15); --fill-2:rgba(140,210,200,.08);
  --seg-on:rgba(150,225,210,.20); --field:rgba(0,0,0,.24); --bar-out:rgba(205,232,226,.26);
  --shadow:rgba(0,8,10,.45); --shadow-panel:rgba(0,6,8,.55); --cap-shadow:rgba(2,12,14,.95);
  --invert-bg:#dff5ef; --invert-fg:#062024; --tick:#062024;
  --pill-new-bg:rgba(60,150,255,.2); --pill-new-fg:#7cc0ff; --pill-hot-bg:rgba(233,138,168,.2); --pill-hot-fg:#f5a9c2;
  --mint:#9fe6d4; --mint-dim:rgba(159,230,212,.55); --pink:#ef7fa3;
  --blue:#2f8be6; --blue-hover:#4a9cf0; --green:#46c98e; --green-text:#6fdcaa;
  --ugc:#ef6f97; --edit:#6fd3e8; --jobs:#b98cf0; --me:#f2d36b; --orange:#f5a14a; --red:#ff6a5f; --gray:#8fa8a4;
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.22,1,.36,1);--ease-out:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#2c6a50; --sea-glow:rgba(255,250,215,.16);
  --mat:rgba(244,246,232,.80); --mat-strong:rgba(246,247,236,.96);
  --panel-a:rgba(250,251,240,.86); --panel-b:rgba(234,240,226,.90); --panel-rim:rgba(255,255,255,.75); --panel-hi:rgba(255,255,255,.85);
  --hair:rgba(20,62,46,.11); --hair-strong:rgba(20,62,46,.2);
  --label:#143428; --label-2:rgba(20,52,40,.66); --label-3:rgba(20,52,40,.42);
  --fill:rgba(40,100,75,.12); --fill-2:rgba(40,100,75,.07);
  --seg-on:#fff; --field:rgba(255,255,255,.7); --bar-out:rgba(20,52,40,.2);
  --shadow:rgba(8,40,26,.22); --shadow-panel:rgba(8,40,26,.3); --cap-shadow:rgba(8,36,24,.9);
  --invert-bg:#143428; --invert-fg:#f6f6ea; --tick:#fff;
  --pill-new-bg:rgba(0,110,220,.12); --pill-new-fg:#0b5fb8; --pill-hot-bg:rgba(214,70,120,.12); --pill-hot-fg:#b2365f;
  --mint:#2f7a5c; --mint-dim:rgba(47,122,92,.55); --pink:#d9507e;
  --blue:#1f74d1; --blue-hover:#2f84e0; --green:#2f9e6a; --green-text:#1f7a50;
  --ugc:#d9507e; --edit:#2a9bb8; --jobs:#8a56c9; --me:#c99a12; --orange:#d97b1c; --red:#d63a2f; --gray:#6f8a84;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--label);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;transition:background-color .5s}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* The ocean: a WebGL canvas behind everything. Panels and the floating buttons are placed over it in screen space every frame. */
#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:var(--bg);transition:background-color .5s}
#viewport.panning{cursor:grabbing}
#sea,#bird{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#sea{pointer-events:none}
#bird{pointer-events:none;z-index:4000}
#world,#floats{position:absolute;left:0;top:0;width:0;height:0}
.nogl #viewport{background:radial-gradient(70% 60% at 50% 48%,#0f3a3c,var(--bg))}
:root[data-theme="light"].nogl #viewport{background:radial-gradient(70% 60% at 30% 20%,#7aa77f,var(--bg))}

/* Panels: the calorie-card look. Dark sea glass, a thin pale rim, mono headings, dotted gauges. */
.panel{position:absolute;left:0;top:0;width:440px;border-radius:16px;transform-origin:50% 100%;
  background:linear-gradient(180deg,var(--panel-a),var(--panel-b));border:1px solid var(--panel-rim);
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  box-shadow:inset 0 1px 0 var(--panel-hi),0 30px 70px var(--shadow-panel),0 0 60px var(--sea-glow);cursor:default}
.panel.wide{width:520px}
.panel.leaving{pointer-events:none}
.panel::after{content:"";position:absolute;left:8%;right:8%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--mint-dim),transparent);opacity:.6;pointer-events:none}
.panel.glow{box-shadow:inset 0 1px 0 var(--panel-hi),0 30px 70px var(--shadow-panel),0 0 0 1px var(--mint-dim),0 0 80px var(--sea-glow)}
.ph{position:relative;display:flex;align-items:flex-start;gap:12px;padding:18px 16px 12px 20px;user-select:none}
.ph .ic{width:34px;height:34px;display:grid;place-items:center;color:var(--c,var(--mint));flex:none;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c,var(--mint)) 45%,transparent))}
.ph .ic svg{width:30px;height:30px;stroke-width:1.8}
.ph .tt{flex:1;min-width:0}
.ph h2{margin:0;font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.ph p{margin:3px 0 0;font-size:13px;color:var(--label-2)}
.x{width:28px;height:28px;border-radius:50%;border:0;background:none;color:var(--label-3);display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.x:hover{background:var(--fill);color:var(--label)}
.x svg{width:13px;height:13px;stroke-width:2.4}
.pb{padding:0 20px 18px;max-height:500px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y}
.pb::-webkit-scrollbar{display:none}
.pb.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 40px),transparent);mask-image:linear-gradient(#000 calc(100% - 40px),transparent)}

.seg{display:flex;padding:2px;border-radius:10px;background:var(--fill-2);margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:8px;font-size:13px;font-weight:500;color:var(--label-2);white-space:nowrap;transition:transform .4s var(--spring)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--label);box-shadow:0 3px 8px rgba(0,0,0,.18)}

.rows{display:flex;flex-direction:column}
.row{border-top:1px solid var(--hair)}
.row:first-child{border-top:0}
.rb{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:3px 12px;width:100%;border:0;background:none;text-align:left;padding:11px 0;align-items:baseline}
.rb:hover .subj{color:var(--label);text-decoration:underline;text-decoration-color:var(--hair-strong);text-underline-offset:3px}
.dotc{width:8px;height:8px;border-radius:50%;background:var(--c);align-self:center}
.from{font-weight:600;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:13px;color:var(--label-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.subj,.sum{grid-column:2 / -1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj{font-size:14px;color:var(--label)}
.sum{font-size:13px;color:var(--label-2)}
.flag{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--blue);vertical-align:1px}
.detail{padding:0 0 14px 22px;display:flex;flex-direction:column;gap:12px;animation:unfold .4s var(--ease-out) both;transform-origin:top}
@keyframes unfold{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.detail p{margin:0;font-size:14px;color:var(--label-2);line-height:1.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;background:var(--fill);color:var(--label);transition:transform .45s var(--spring),background .2s}
.btn:hover{background:var(--hair-strong)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-hover)}
.btn:disabled{opacity:.4;cursor:default;transform:none}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.stat{background:var(--fill-2);border-radius:14px;padding:12px 14px}
.stat small{display:block;font-size:12px;color:var(--label-2)}
.stat b{display:block;font-size:21px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.sec{font-size:13px;font-weight:600;color:var(--label-2);margin:4px 0 10px}
.bars{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.bar-row{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.bar-row .nm{color:var(--label-2);white-space:nowrap}
.track{display:flex;flex-direction:column;gap:4px}
.bar{height:8px;border-radius:4px;background:var(--c);min-width:2px;transform-origin:left;animation:grow .8s var(--ease-out) both .2s}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.bar.out{background:var(--bar-out)}
.bar-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--label-2);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--label-2);margin:-4px 0 12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.tx{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--hair);font-size:14px}
.tx:first-child{border-top:0}
.tx small{display:block;font-size:12px;color:var(--label-2)}
.amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt.in{color:var(--green-text)}

.check{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--hair);cursor:pointer;font-size:15px}
.group .sec + .check{border-top:0}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--label-3);margin:0;flex:none;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s,transform .45s var(--spring)}
.check input:active{transform:scale(.9)}
.check input:checked{background:var(--c);border-color:var(--c);animation:boing .5s var(--spring)}
@keyframes boing{0%{transform:scale(.82)}100%{transform:none}}
.check input:checked::after{content:"";width:5px;height:10px;border:solid var(--tick);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked + span{color:var(--label-3);text-decoration:line-through}

.agenda{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:66px 4px minmax(0,1fr);gap:12px;padding:10px 12px;border-radius:14px;background:var(--fill-2)}
.ev time{font-size:13px;color:var(--label-2);font-variant-numeric:tabular-nums;padding-top:1px}
.ev .stripe{border-radius:2px;background:var(--c)}
.ev b{display:block;font-weight:600;font-size:15px}
.ev span{font-size:13px;color:var(--label-2)}

.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--label-2);white-space:nowrap}
.pill.new{background:var(--pill-new-bg);color:var(--pill-new-fg)}
.pill.hot{background:var(--pill-hot-bg);color:var(--pill-hot-fg)}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--hair);align-items:center}
.job:first-child{border-top:0}
.job b{font-weight:600;font-size:15px}
.job span{font-size:13px;color:var(--label-2);grid-column:1}
.job .pill{grid-row:1 / span 2;grid-column:2}

.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hair);font-size:15px}
.set:first-child{border-top:0}
.set .t{flex:1;min-width:0}
.set small{display:block;font-size:13px;color:var(--label-2)}
.switch{width:51px;height:31px;border-radius:999px;border:0;background:var(--fill);position:relative;flex:none;padding:0;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:transform .45s var(--spring),width .25s}
.switch:active::after{width:33px}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch[aria-checked="true"]:active::after{transform:translateX(14px)}
.soon{font-size:13px;color:var(--label-3)}

textarea.draft{width:100%;min-height:180px;resize:vertical;border-radius:14px;border:1px solid var(--hair);background:var(--field);padding:12px 14px;font-size:15px;line-height:1.5;color:var(--label);outline:none}
textarea.draft:focus{border-color:var(--blue)}
.note{font-size:12px;color:var(--label-3)}

/* Floating buttons: little app icons bobbing on the water around the boat, each takes you to a tab without asking Allie. */
.float{position:absolute;left:0;top:0;transform-origin:50% 100%;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--label)}
.float i{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--c);
  background:radial-gradient(120% 120% at 30% 20%,color-mix(in srgb,var(--c) 22%,var(--panel-a)),var(--panel-b));
  border:1px solid color-mix(in srgb,var(--c) 30%,var(--panel-rim));
  box-shadow:inset 0 1px 0 var(--panel-hi),0 8px 20px var(--shadow),0 0 22px color-mix(in srgb,var(--c) 22%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .35s var(--spring),box-shadow .3s}
.float i svg{width:22px;height:22px;stroke-width:1.8;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 55%,transparent))}
.float span{font:500 11px/1 var(--mono);letter-spacing:.02em;white-space:nowrap;color:var(--mint);padding:4px 7px;border-radius:4px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mint) 22%,transparent);text-shadow:0 0 8px var(--sea-glow)}
.float span::before{content:"[ "}.float span::after{content:" ]"}
.float:hover i,.float:focus-visible i{transform:translateY(-3px) scale(1.06);box-shadow:inset 0 1px 0 var(--panel-hi),0 12px 26px var(--shadow),0 0 30px color-mix(in srgb,var(--c) 45%,transparent)}
.float:hover span{background:var(--mint);color:var(--bg);text-shadow:none}
.float:active i{transform:scale(.94);transition-duration:.08s}
.float.on i{border-color:var(--c);box-shadow:inset 0 1px 0 var(--panel-hi),0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent),0 0 30px color-mix(in srgb,var(--c) 40%,transparent)}
.float.live span{color:var(--pink)}
.float.live i::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--pink);opacity:.7;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:.8}to{transform:scale(1.25);opacity:0}}
:root[data-theme="light"] .float span{color:#f7f5e3;background:rgba(18,60,42,.55);box-shadow:inset 0 0 0 1px rgba(247,245,227,.25);text-shadow:none}
:root[data-theme="light"] .float:hover span{background:#f7f5e3;color:#173a2b}
/* A tab out on the water: a wrapper carries its 3D placement, the panel inside animates on its own. */
.tabw{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.tabw > .panel{position:relative;left:auto;top:auto}
.tabw.back > .panel > *,.tabw.back .grab{visibility:hidden}
.tabw.lifted > .panel{box-shadow:inset 0 1px 0 var(--panel-hi),0 44px 90px var(--shadow-panel),0 0 0 1px var(--mint-dim)}
/* The grab bar under a tab: drag it to carry the tab somewhere else on the water. */
.grab{width:150px;height:26px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{display:block;width:92px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--label) 34%,transparent);box-shadow:0 0 12px var(--sea-glow);transition:width .3s var(--spring),background .2s}
.grab:hover i,.grab:focus-visible i,.tabw.lifted .grab i{width:124px;background:color-mix(in srgb,var(--label) 80%,transparent)}
.tabw.lifted .grab{cursor:grabbing}
/* Settings: a sheet on the right, in front of everything on the water. */
#sheet{position:fixed;inset:0;z-index:4550;pointer-events:none}
body.sheet-open .dock{left:calc((100vw - 472px)/2);width:min(640px,calc(100vw - 504px))}
@media (max-width:760px){body.sheet-open .dock{left:50%;width:calc(100% - 32px)}}
.panel.sheet{position:fixed;left:auto;top:calc(env(safe-area-inset-top,0px) + 66px);right:16px;width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 176px);display:flex;flex-direction:column;pointer-events:auto;transform-origin:100% 50%}
.panel.sheet .pb{max-height:none;flex:1 1 auto;min-height:0}
#settings[aria-pressed="true"]{color:var(--mint);box-shadow:inset 0 1px 0 var(--panel-hi),0 0 0 1px var(--mint-dim),0 0 22px var(--sea-glow)}
/* The workbench mat lies on the desk in build mode; widgets get cards on it. */
.bench-mat{position:absolute;left:0;top:0;width:760px;min-height:400px;transform-origin:0 0;z-index:3960;padding:22px 26px;border-radius:10px;
  background:linear-gradient(180deg,rgba(28,46,44,.9),rgba(18,32,32,.92));border:1px solid rgba(165,235,220,.22);
  box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),inset 0 1px 0 rgba(210,255,245,.12);color:#dff2ec;transition:opacity .3s;
  background-image:linear-gradient(rgba(165,235,220,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(165,235,220,.07) 1px,transparent 1px),linear-gradient(180deg,rgba(28,46,44,.92),rgba(18,32,32,.94));background-size:28px 28px,28px 28px,auto}
:root[data-theme="light"] .bench-mat{background-image:linear-gradient(rgba(20,62,46,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(20,62,46,.08) 1px,transparent 1px),linear-gradient(180deg,#eef0e2,#e2e6d4);color:#173a2b;border-color:rgba(20,62,46,.2)}
.bench-mat.away{opacity:0}
.bench-mat header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.bench-mat header b{font:600 22px var(--mono)}.bench-mat header small{font:12px var(--mono);opacity:.6}
.bench-mat .bm-done{margin-left:auto}
.bm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.bm-card{border-radius:12px;padding:12px 14px;background:var(--panel-a);border:1px solid var(--panel-rim);box-shadow:0 10px 24px var(--shadow)}
.bm-card h3{margin:0 0 8px;font:600 14px var(--mono)}
.bm-empty{margin:60px auto 0;max-width:440px;text-align:center;font:14px/1.6 var(--mono);opacity:.75}
.bm-empty code{font:inherit;padding:1px 6px;border-radius:4px;background:rgba(127,127,127,.18)}
/* Labels over the places you can go: click one to sail there. */
#places{position:absolute;left:0;top:0;width:0;height:0;z-index:3950}
.place{position:absolute;left:0;top:0;border:0;background:none;padding:0;cursor:pointer;font:600 12.5px/1 var(--mono);letter-spacing:.04em;color:var(--mint);white-space:nowrap}
.place span{display:inline-block;padding:6px 10px;border-radius:5px;background:color-mix(in srgb,var(--bg) 70%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mint) 30%,transparent),0 0 22px var(--sea-glow);transition:background .2s,color .2s}
.place span::before{content:"[ "}.place span::after{content:" ]"}
.place:hover span,.place:focus-visible span{background:var(--mint);color:var(--bg)}
:root[data-theme="light"] .place{color:#f7f5e3}
:root[data-theme="light"] .place span{background:rgba(18,60,42,.55);box-shadow:inset 0 0 0 1px rgba(247,245,227,.3)}
#home[aria-pressed="true"]{color:var(--mint)}
/* The chat on the beach: the conversation with Allie, out only at home. */
.chatlog{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 66px);bottom:24px;width:min(400px,calc(100vw - 32px));z-index:4560;display:none;flex-direction:column;border-radius:16px;
  background:linear-gradient(180deg,var(--panel-a),var(--panel-b));border:1px solid var(--panel-rim);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  box-shadow:inset 0 1px 0 var(--panel-hi),0 30px 70px var(--shadow-panel);animation:rise .4s var(--spring)}
body.at-home .chatlog{display:flex}
/* closed: just the input line, centred near the bottom */
.chatlog:not(.open){top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);right:auto;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));border-radius:999px;animation:none}
.chatlog:not(.open) .cl-h,.chatlog:not(.open) .cl-list,.chatlog:not(.open) .cl-min{display:none}
.chatlog:not(.open) .cl-in{border-top:0;padding:6px 6px 6px 18px}
.chatlog.open{animation:rise .35s var(--spring)}
.cl-min{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--label-3);font:600 18px/1 var(--font);display:grid;place-items:center}
.cl-min:hover{background:var(--fill);color:var(--label)}
body.at-home.sheet-open .chatlog{display:none}
body.at-home .dock .captions,body.at-home .dock .controls,body.at-home #bar{display:none}
body.at-home .dock{display:none}
.cl-h{display:flex;align-items:baseline;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--hair)}
.cl-h b{font:600 18px var(--mono);letter-spacing:.01em}
.cl-h small{font-size:12.5px;color:var(--label-3)}
.cl-list{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.cl-list::-webkit-scrollbar{display:none}
.msg{max-width:86%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .35s var(--spring)}
.msg.allie{align-self:flex-start;background:var(--fill-2);border:1px solid var(--hair);border-bottom-left-radius:5px}
.msg.you{align-self:flex-end;background:color-mix(in srgb,var(--mint) 22%,transparent);border:1px solid color-mix(in srgb,var(--mint) 30%,transparent);border-bottom-right-radius:5px}
.cl-sep{align-self:center;font:11px var(--mono);color:var(--label-3);padding:2px 0 6px}
.cl-in{display:flex;gap:8px;align-items:center;padding:10px 10px 10px 14px;border-top:1px solid var(--hair)}
.cl-in input{flex:1;min-width:0;border:0;background:none;outline:none;font:14.5px var(--mono);color:var(--label);padding:8px 0}
.cl-in input::placeholder{color:var(--label-3)}
@media (max-width:760px){body.at-home .dock{left:50%;width:calc(100% - 32px)}.chatlog{top:auto;height:46vh}}
/* Allie asleep: little z's drifting up from her */
#zzz{position:absolute;left:0;top:0;z-index:4001;pointer-events:none;font:700 14px var(--mono);color:#b6f0e2;text-shadow:0 0 8px rgba(120,230,205,.6)}
:root[data-theme="light"] #zzz{color:#fbf8de;text-shadow:0 1px 4px rgba(10,40,26,.6)}
#zzz b{position:absolute;left:0;top:0;opacity:0;animation:zz 3s ease-out infinite}
#zzz b:nth-child(2){animation-delay:1s;font-size:17px}#zzz b:nth-child(3){animation-delay:2s;font-size:12px}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-58px)}}
@media (prefers-reduced-motion:reduce){#zzz b{animation:none;opacity:1}#zzz b:nth-child(2){transform:translate(12px,-22px)}#zzz b:nth-child(3){transform:translate(22px,-40px)}.float.live i::after{animation:none}}

/* Fixed chrome */
.dragbar{position:fixed;top:0;left:0;right:0;height:40px;-webkit-app-region:drag;z-index:4500}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;display:flex;align-items:center;gap:10px;z-index:4600;-webkit-app-region:no-drag}
.fx{width:44px;height:44px;border-radius:50%;border:1px solid var(--panel-rim);display:grid;place-items:center;flex:none;color:var(--label-2);
  background:var(--mat);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 var(--panel-hi),0 8px 24px var(--shadow);
  transition:color .2s,box-shadow .3s,background .3s}
.fx:hover{color:var(--label)}
.fx:active{transform:scale(.94);transition:transform .08s ease-out}
.fx .i{width:20px;height:20px}
#sleep[aria-pressed="true"]{color:#c9bcff;box-shadow:inset 0 1px 0 var(--panel-hi),0 0 0 1px rgba(201,188,255,.35),0 0 26px rgba(160,140,255,.35)}
#sleep[aria-pressed="true"] .i{fill:currentColor}
.chip.setup{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:var(--mat);border:1px solid var(--panel-rim);font:12px var(--mono);color:var(--label-2);white-space:nowrap}
.link{background:none;border:0;padding:0;color:var(--pink);font:inherit;font-size:12px;cursor:pointer}
.hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:4600;font:12px var(--mono);color:var(--label-3);pointer-events:none;white-space:normal;text-align:center;max-width:calc(100vw - 280px);transition:opacity .8s;text-shadow:0 0 6px var(--cap-shadow)}

.scrim{position:fixed;left:0;right:0;bottom:0;height:260px;z-index:4100;pointer-events:none;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 70%,transparent))}
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);width:min(640px,calc(100% - 32px));z-index:4600;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.dock > *{pointer-events:auto}
.captions{text-align:center;max-width:600px;pointer-events:none;min-height:24px;text-shadow:0 1px 3px var(--cap-shadow),0 0 24px var(--cap-shadow)}
.cap-user{font:12px var(--mono);color:var(--label-2);margin-bottom:4px;min-height:1px}
.cap-allie{font-size:15.5px;font-weight:500;letter-spacing:-.01em;line-height:1.4;text-wrap:balance;color:var(--label)}
.cap-allie .w{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(5px);transition:opacity .5s var(--ease-out),filter .5s var(--ease-out),transform .5s var(--ease-out)}
.cap-allie .w.on{opacity:1;filter:none;transform:none}
:root[data-theme="light"] .captions{color:#f6f5e4}
:root[data-theme="light"] .cap-allie{color:#fbfaee}
:root[data-theme="light"] .cap-user{color:rgba(246,245,228,.78)}
.controls{display:flex;align-items:center;gap:10px}
.fx.chat{width:52px;height:52px}
.fx.chat[aria-pressed="true"]{color:var(--mint);box-shadow:inset 0 1px 0 var(--panel-hi),0 0 0 1px var(--mint-dim),0 0 24px var(--sea-glow)}
.bar-input{display:flex;align-items:center;gap:8px;width:min(560px,100%);padding:6px 6px 6px 16px;border-radius:16px;background:var(--mat-strong);border:1px solid var(--panel-rim);
  box-shadow:inset 0 1px 0 var(--panel-hi),0 18px 40px var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:rise .35s var(--spring)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.bar-input input{flex:1;min-width:0;border:0;background:none;outline:none;font:15px var(--mono);padding:8px 0;color:var(--label)}
.bar-input input::placeholder{color:var(--label-3)}
.round{width:38px;height:38px;border-radius:12px;border:0;display:grid;place-items:center;flex:none}
.send{background:var(--blue);color:#fff}
.send svg{stroke-width:2.2}
.send:active{transform:scale(.94)}
/* Thinking: a small braille spinner that stays put while Allie works out a reply. */
.think{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:999px;font:12.5px var(--mono);color:var(--mint);background:var(--mat);border:1px solid var(--panel-rim);box-shadow:0 0 22px var(--sea-glow);animation:rise .3s var(--spring)}
.think .spin{width:1ch;display:inline-block}

@media (max-width:700px){.cap-allie{font-size:14.5px}.float{font-size:12px}}
@media (prefers-reduced-motion:reduce){.cap-allie .w{transition:none;filter:none}.bar-input,.think{animation:none}}
@media (prefers-reduced-transparency:reduce){
  .panel,.fx,.bar-input,.think,.chip.setup{background:var(--mat-strong)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
@media (prefers-contrast:more){
  :root{--hair:rgba(200,240,230,.34);--hair-strong:rgba(200,240,230,.5);--label-2:rgba(225,242,238,.88);--label-3:rgba(225,242,238,.66);--panel-rim:rgba(200,240,230,.5)}
  :root[data-theme="light"]{--hair:rgba(0,0,0,.34);--hair-strong:rgba(0,0,0,.5);--label-2:rgba(20,40,32,.9);--label-3:rgba(20,40,32,.72);--panel-rim:rgba(0,0,0,.4)}
}

/* Inside the panels: outlined pills, dotted gauges, mono numbers. */
.btn{border:1px solid var(--hair-strong);border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:500;background:none;color:var(--label);transition:background .2s,border-color .2s}
.btn:hover{background:var(--fill-2);border-color:var(--mint-dim)}
.btn:active{transform:scale(.96);transition-duration:.08s}
.btn.primary{background:var(--blue);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--blue-hover)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.quick button{border:1px solid var(--hair-strong)!important;background:none!important;color:var(--label)}
.quick button:hover{border-color:var(--mint-dim)!important;background:var(--fill-2)!important}
.sec{font-family:var(--mono);font-weight:500;letter-spacing:.01em;color:var(--label)}
.bigtime,.ring .mid b,.wnow b,.bizsum b,.stat b,.tile b{font-family:var(--mono);font-weight:500;letter-spacing:0}
.dots-mask,.ring svg,.macro .tr,.goalrow .tr,.week .b,.stages i,.bar:not(.out){-webkit-mask:radial-gradient(circle,#000 58%,transparent 64%) 0 0/3px 3px;mask:radial-gradient(circle,#000 58%,transparent 64%) 0 0/3px 3px}
.ring .trk{stroke:var(--fill)}
.ring .mid b{font-size:26px}
.macro .tr{height:7px;background:var(--fill)}
.play{background:var(--pink);box-shadow:0 10px 26px color-mix(in srgb,var(--pink) 35%,transparent)}
.day.today .n{background:var(--pink)}
.now{color:var(--pink)}.now::after{background:linear-gradient(90deg,var(--pink),transparent)}
.week .col.today .b,.proj.run .mini-play,.mini-play.live{background:var(--pink)}
.spark polyline{stroke:var(--pink)}.spark circle{fill:var(--pink)}
.jobrow .new{background:var(--pink)}
.vopt.on .rad{border-color:var(--pink)}.vopt.on .rad::after{background:var(--pink)}
.connform input{outline:none;transition:border-color .2s}
.connform input:focus{border-color:var(--mint-dim)}
.connform input::placeholder{color:var(--label-3)}
.add input:focus,.goal input:focus,textarea.draft:focus,.crit input:focus{border-color:var(--mint-dim)}

/* Today, calendar, to-do, edit timer, calories */
.empty{font-size:14px;color:var(--label-3);padding:6px 0;margin:0}
.now{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#ff5fb4;margin:0 2px}
.now::after{content:"";flex:1;height:1.5px;border-radius:1px;background:linear-gradient(90deg,#ff5fb4,transparent)}
.ev.past{opacity:.45}
.ev.can{grid-template-columns:66px 4px minmax(0,1fr) 26px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.tile{border:0;text-align:left;background:var(--fill-2);border-radius:14px;padding:10px 12px;color:var(--label);min-width:0;transition:transform .3s var(--ease-out),background .2s}
.tile:hover{background:var(--fill)}
.tile:active{transform:scale(.97)}
.tile small{display:block;font-size:11.5px;color:var(--label-2)}
.tile b{display:block;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .of{font-size:12px;font-weight:500;color:var(--label-2)}
.add{display:flex;gap:8px;align-items:center;margin-top:10px}
.add input{flex:1;min-width:0;height:38px;border-radius:12px;border:1px solid var(--hair);background:var(--field);padding:0 12px;font-size:14px;color:var(--label);outline:none;transition:border-color .2s}
.add input:focus{border-color:var(--blue)}
.add input[type=time]{flex:none;width:118px}
.add input.kcal{flex:none;width:84px}
.add .btn{height:38px;padding:0 15px;flex:none}
.todo{display:flex;align-items:center;gap:8px;border-top:1px solid var(--hair)}
.todos > .todo:first-child{border-top:0}
.todo .check{flex:1;min-width:0;border-top:0}
.due{font-size:12px;color:var(--label-3);white-space:nowrap}
.due.late{color:var(--red)}
.linkbtn{border:0;background:none;color:var(--blue);font-size:13px;font-weight:500;padding:12px 0 2px}
.del{width:26px;height:26px;border-radius:50%;border:0;background:none;color:var(--label-3);display:grid;place-items:center;flex:none;opacity:0;transition:opacity .2s,background .2s}
.del svg{width:12px;height:12px;stroke-width:2.2}
.todo:hover .del,.meal:hover .del,.ev:hover .del,.del:focus-visible{opacity:1}
.del:hover{background:var(--fill-2);color:var(--label)}
@media (hover:none){.del{opacity:.55}}
.fresh{animation:fresh .5s var(--ease-out) both}
@keyframes fresh{from{opacity:0;transform:translateY(-4px)}}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h b{font-size:16px;font-weight:650}
.cal-nav{display:flex;gap:4px}
.cal-nav button{height:30px;min-width:30px;padding:0 8px;border-radius:999px;border:0;background:var(--fill-2);color:var(--label);display:grid;place-items:center;font-size:12.5px;transition:background .2s,transform .25s var(--ease-out)}
.cal-nav button:hover{background:var(--fill)}
.cal-nav button:active{transform:scale(.94)}
.cal-nav svg{width:15px;height:15px;stroke-width:2}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.dow{font-size:11px;font-weight:600;color:var(--label-3);padding:4px 0}
.day{height:44px;border:0;border-radius:12px;background:none;color:var(--label);font-size:14px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;transition:background .2s,transform .25s var(--ease-out)}
.day:hover{background:var(--fill-2)}
.day:active{transform:scale(.94)}
.day .n{width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.out{color:var(--label-3)}
.day.sel{background:var(--fill)}
.day.today .n{background:#ff4fa8;color:#fff;font-weight:650}
.day .dots{display:flex;gap:2px;height:4px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--c)}
.daylist{margin-top:12px}
.clockface{display:flex;align-items:center;gap:16px;padding:4px 0 16px}
.bigtime{font-size:42px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.cf-sub{display:block;font-size:13px;color:var(--label-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;background:#ff4fa8;color:#fff;box-shadow:0 10px 26px rgba(255,79,168,.35),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .3s var(--ease-out),background .25s,box-shadow .25s}
.play:hover{transform:scale(1.03)}
.play:active{transform:scale(.95)}
.play.on{background:var(--invert-bg);color:var(--invert-fg);box-shadow:0 0 0 6px var(--fill-2)}
.play svg,.mini-play svg,.hear svg{fill:currentColor;stroke:none}
.play svg{width:22px;height:22px}
.proj{display:grid;grid-template-columns:minmax(0,1fr) auto 34px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.proj b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj small{font-size:12.5px;color:var(--label-2)}
.proj .tot{font-size:14px;font-variant-numeric:tabular-nums;color:var(--label-2)}
.proj.run b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff375f;margin-right:8px;vertical-align:2px;animation:rec 1.6s ease-in-out infinite}
.mini-play{width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);color:var(--label);display:grid;place-items:center;transition:transform .25s var(--ease-out),background .2s}
.mini-play:active{transform:scale(.92)}
.mini-play svg{width:13px;height:13px}
.proj.run .mini-play{background:#ff4fa8;color:#fff}
.sec .sec-r{float:right;font-weight:500;color:var(--label-3)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:94px;margin:6px 0 4px}
.week .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.week .b{width:100%;max-width:26px;border-radius:6px;background:var(--edit);transform-origin:bottom;animation:growy .7s var(--ease-out) both}
.week .col.today .b{background:#ff4fa8}
.week span{font-size:11px;color:var(--label-3)}
@keyframes growy{from{transform:scaleY(0)}}
.ringrow{display:flex;align-items:center;gap:18px;margin-bottom:14px}
.ring{width:128px;height:128px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:13;stroke-linecap:round}
.ring .trk{stroke:var(--fill)}
.ring .val{stroke:url(#ringGrad);animation:ringin 1.1s var(--ease-out) both}
@keyframes ringin{from{stroke-dashoffset:var(--from)}}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .mid small{font-size:11.5px;color:var(--label-2)}
.macros{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.macro small{display:flex;justify-content:space-between;font-size:12px;color:var(--label-2);margin-bottom:4px;font-variant-numeric:tabular-nums}
.macro .tr{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.macro .tr i{display:block;height:100%;border-radius:3px;background:var(--c);transform-origin:left;animation:grow .8s var(--ease-out) both}
.left{font-size:13px;font-weight:600;color:var(--green-text)}
.left.over{color:var(--red)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}
.quick button{height:30px;padding:0 11px;border-radius:999px;border:0;background:var(--fill-2);color:var(--label);font-size:12.5px;transition:transform .25s var(--ease-out),background .2s}
.quick button:hover{background:var(--fill)}
.quick button:active{transform:scale(.95)}
.meal{display:grid;grid-template-columns:minmax(0,1fr) auto 26px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--hair);font-size:14px}
.meal small{display:block;font-size:12px;color:var(--label-2)}
.meal .k{font-variant-numeric:tabular-nums;color:var(--label-2);white-space:nowrap}
.goal{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--label-2)}
.goal span{flex:1}
.goal input{width:84px;height:32px;border-radius:10px;border:1px solid var(--hair);background:var(--field);padding:0 10px;font-size:14px;color:var(--label);text-align:right;font-variant-numeric:tabular-nums;outline:none}
.goal input:focus{border-color:var(--blue)}
.set.col{flex-direction:column;align-items:stretch;gap:10px}
.vp{display:flex;flex-direction:column;gap:6px}
.vopt{display:grid;grid-template-columns:20px minmax(0,1fr) 32px;gap:10px;align-items:center;padding:8px 8px 8px 12px;border-radius:14px;border:1px solid transparent;background:var(--fill-2);cursor:pointer;transition:border-color .2s,background .2s}
.vopt:hover{background:var(--fill)}
.vopt.on{border-color:rgba(255,95,180,.55);background:rgba(255,95,180,.09)}
.vopt .rad{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--label-3);display:grid;place-items:center}
.vopt.on .rad{border-color:#ff5fb4}
.vopt.on .rad::after{content:"";width:9px;height:9px;border-radius:50%;background:#ff5fb4}
.vopt b{font-weight:600;font-size:14.5px}
.vopt small{font-size:12.5px;color:var(--label-2);margin-left:6px}
.hear{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--label);display:grid;place-items:center}
.hear svg{width:11px;height:11px}

::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

.star{width:26px;height:26px;border:0;background:none;color:var(--label-3);display:grid;place-items:center;flex:none;border-radius:50%;opacity:.6}
.star svg{width:15px;height:15px}
.star.on{color:#ffb340;opacity:1}.star.on svg{fill:currentColor}
.todo .check{flex:1;min-width:0}
.seg .ct{font-size:11px;color:var(--label-3);margin-left:2px}
.add input[type=date]{flex:none;width:138px}
.add select{flex:none;height:38px;border-radius:12px;border:1px solid var(--hair);background:var(--field);color:var(--label);padding:0 8px;font-size:14px}
.blank{padding:26px 8px 14px;text-align:center}
.blank p{margin:0;font-size:15px;color:var(--label-2)}
.blank small{display:block;margin-top:4px;font-size:13px;color:var(--label-3)}
.connect{text-align:center;padding:14px 8px 8px}
.connect .big{width:58px;height:58px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 14px 30px var(--shadow),inset 0 1px 0 rgba(255,255,255,.35)}
.connect .big .i{width:28px;height:28px}
.connect b{font-size:17px}
.connect p{color:var(--label-2);font-size:14px;line-height:1.45;margin:6px 0 16px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.srcs span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--fill-2);color:var(--label-2)}
.srcs small{font-size:12px;color:var(--label-3)}
.sortrow{display:flex;gap:4px;align-items:center;margin:-2px 0 4px;font-size:12px;color:var(--label-3)}
.sortrow span{margin-right:4px}
.sortrow button{border:0;background:none;color:var(--label-2);font-size:12px;padding:3px 8px;border-radius:999px}
.sortrow button[aria-pressed="true"]{background:var(--fill);color:var(--label)}
.proj{grid-template-columns:minmax(0,1fr) auto 34px 26px}
.del.armed{opacity:1;background:#ff375f;color:#fff}
.panel[data-key="finances"] .tx{grid-template-columns:10px minmax(0,1fr) auto 26px}
.unit{border:0;background:var(--fill-2);color:var(--label-2);font-size:11px;padding:2px 8px;border-radius:999px}
.wnow{font-size:14px;color:var(--label-2);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.wnow b{font-size:26px;color:var(--label);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wnow .dn{color:var(--green-text);margin-left:6px}.wnow .up{color:#ff9f43;margin-left:6px}
.spark{width:100%;height:64px;display:block;margin:6px 0 2px;overflow:visible}
.spark polyline{fill:none;stroke:#ff4fa8;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark circle{fill:#ff4fa8}
.bizsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.bizsum div{padding:10px 12px;border-radius:14px;background:var(--fill-2)}

.vid .vt small{font-size:12.5px;color:var(--label-2)}

.stages i{width:100%;height:5px;border-radius:3px;background:var(--fill)}
.stages button.on i{background:var(--edit)}
.stages button[aria-pressed="true"]{color:var(--label)}

.mini-play.live{background:#ff4fa8;color:#fff}

.goalrow{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.goalrow b{display:block;font-size:15px}.goalrow small{font-size:12.5px;color:var(--label-2)}
.goalrow .tr{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.goalrow .tr i{display:block;height:100%;border-radius:3px;background:var(--ugc)}
.step{display:flex;gap:2px}
.step button:not(.del){width:26px;height:26px;border-radius:50%;border:0;background:var(--fill-2);color:var(--label);display:grid;place-items:center}

.srcrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--hair)}
.srcrow b{font-size:15px}.srcrow small{display:block;font-size:12.5px;color:var(--label-2)}
.lg-dot{width:32px;height:32px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.crit{display:grid;gap:8px;margin-bottom:6px}
.crit label{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:8px;font-size:13px;color:var(--label-2)}
.crit input{height:38px;border-radius:12px;border:1px solid var(--hair);background:var(--field);padding:0 12px;font-size:14px;color:var(--label);outline:none;min-width:0}

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const root = document.documentElement;
  const icon = id => `<svg class="i"><use href="#i-${id}"/></svg>`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = n => (n < 0 ? "−" : "") + "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const BIZ = { ugc: ["UGC", "AI influencer UGC", "var(--ugc)"], edit: ["Editing", "Video editing", "var(--edit)"], jobs: ["3D jobs", "3D animation job search", "var(--jobs)"], me: ["Personal", "Personal", "var(--me)"] };

  /* ---------------- Jack's data: starts empty, saved in this browser ---------------- */
  const D0 = new Date(); D0.setHours(0, 0, 0, 0);
  const HR = 3600e3, MIN = 60e3;
  const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const dayOff = n => { const d = new Date(D0); d.setDate(d.getDate() + n); return dkey(d); };
  const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const TODAY = dkey(D0);
  const seed = () => ({ v: 2, next: 100, goal: 2400, unit: "lb", last: null, timer: null, todos: [], events: [], projects: [], food: {}, weights: [], money: [], videos: [],
    goals: [], jobPrefs: { what: "3D animator, character animator, Blender generalist", where: "Remote or Los Angeles", scan: true } });
  const ON_PC = !!(window.allie && allie.desktop); // in a plain browser, window.allie is the canvas with that id
  let S = null; try { S = JSON.parse((ON_PC ? allie.loadData() : localStorage.getItem("allie.data")) || "null"); } catch (e) {}
  if (S && S.v === 1) {
    // Keep only what Jack added himself; the old sample data had ids under 100.
    const n = seed(), mine = x => x.id > 100; n.next = S.next; n.goal = S.goal;
    n.todos = (S.todos || []).filter(mine).map(t => ({ ...t, myDay: t.due === TODAY ? TODAY : "" }));
    n.events = (S.events || []).filter(mine); n.projects = (S.projects || []).filter(mine);
    for (const k in S.food || {}) { const f = S.food[k].filter(mine); if (f.length) n.food[k] = f; }
    S = n;
  }
  if (!S || S.v !== 2) S = seed();
  for (const k of ["videos", "goals", "weights", "money"]) if (!S[k]) S[k] = [];
  const save = () => { clearTimeout(save.t); save.t = setTimeout(() => { const j = JSON.stringify(S); if (ON_PC) allie.saveData(j); else try { localStorage.setItem("allie.data", j); } catch (e) {} }, 150); };
  addEventListener("beforeunload", () => { if (ON_PC) allie.saveData(JSON.stringify(S)); });
  const uid = () => ++S.next;
  let freshId = 0;
  // Each panel that shows a piece of your data redraws when that data changes, so everything stays in step.
  const DEPS = { todos: ["today", "todo", "calendar"], events: ["today", "calendar"], time: ["time", "today", "businesses", "editing"], food: ["calories", "today"], weight: ["calories"], money: ["finances"], biz: ["businesses", "editing", "influencer"], jobs: ["jobs"] };

    else if (d.delProj) { const id = +d.delProj; if (d.armed) { if (S.timer && S.timer.pid === id) stopTimer(true); S.projects = S.projects.filter(p => p.id !== id); changed("time"); } else { d.armed = "1"; t.classList.add("armed"); t.title = "Tap again to remove"; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.classList.remove("armed"); } }, 2500); } }
    else if (d.range) { timeRange = d.range; refresh("time"); }
    else if (d.sort) { timeSort = d.sort; refresh("time"); }
    else if (d.quick) { const q = QUICK[+d.quick]; addFood(q[0], q[1], q[2]); }
    else if (d.delFood) { S.food[TODAY] = foodToday().filter(x => x.id !== +d.delFood); changed("food"); }
    else if (d.unit !== undefined) { S.unit = S.unit === "lb" ? "kg" : "lb"; changed("weight"); }
    else if (d.open) { if (busy) stopTalking(); capU.textContent = ""; run(d.open); }
    else if (d.themeSet) switchTheme(d.themeSet, e.clientX, e.clientY);
    else if (d.brain) { allie.setBrainMode(d.brain); refresh("settings"); }
    else if (d.biz) { bizTab = d.biz; refresh("businesses"); }
    else if (d.stage) { const [id, i] = d.stage.split(":").map(Number), v = S.videos.find(x => x.id === id); if (v) { v.stage = i; changed("biz"); } }
    else if (d.vtime) { const v = S.videos.find(x => x.id === +d.vtime); if (v) { const p = projectNamed(v.title); if (S.timer && S.timer.pid === p.id) stopTimer(); else startTimer(p.id); } }
    else if (d.delVid) { S.videos = S.videos.filter(x => x.id !== +d.delVid); changed("biz"); }
    else if (d.gstep) { const [id, k] = d.gstep.split(":").map(Number), g = S.goals.find(x => x.id === id); if (g) { const st = Math.max(1, Math.round(g.target / 50)); g.cur = Math.max(0, g.cur + k * st); changed("biz"); } }
    else if (d.delGoal) { S.goals = S.goals.filter(x => x.id !== +d.delGoal); changed("biz"); }
    else if (d.delMoney) { S.money = S.money.filter(x => x.id !== +d.delMoney); changed("money"); }
    else if (d.scan !== undefined) { S.jobPrefs.scan = !S.jobPrefs.scan; changed("jobs"); }
    else if (d.reset !== undefined) {
      if (d.armed) { stopTimer(true); S = seed(); save(); Object.keys(open).forEach(refresh); island(); t.textContent = "Cleared"; }
      else { d.armed = "1"; t.textContent = "Tap again to clear everything"; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = "Clear"; } }, 3000); }
    }
  }
  function panelChange(e) {
    const t = e.target;
    if (t.dataset.todo) { const x = S.todos.find(y => y.id === +t.dataset.todo); if (x) { x.done = t.checked; setTimeout(() => changed("todos"), 280); } }
    else if (t.dataset.goal !== undefined) { S.goal = Math.max(1000, Math.min(6000, Math.round(+t.value || 2400))); changed("food"); }
  }
  function panelSubmit(e) {
    const f = e.target.closest("form[data-form]"); if (!f) return; e.preventDefault();
    const kind = f.dataset.form, panel = f.closest(".panel").dataset.key, val = n => (f.elements[n] ? f.elements[n].value.trim() : "");
    let focus = null;
    if (kind === "todo" || kind === "today") {
      const t = val("t"); if (!t) return; const due = kind === "today" ? TODAY : val("due");
      addTodo(cap1(t), due, { myDay: kind === "today" || todoView === "myday" ? TODAY : "", star: kind === "todo" && todoView === "important" }); focus = "t";
    } else if (kind === "event") {
      const w = val("what"); if (!w) return;
      S.events.push({ id: freshId = uid(), d: calSel, t: val("tm") || "12:00", what: cap1(w), biz: guessBiz(w) }); changed("events"); focus = "what";
    } else if (kind === "project") {
      const n = val("n"); if (!n) return;
      projectNamed(n); changed("time"); focus = "n";
    } else if (kind === "food") {
      const w = val("what"), k = Math.round(+val("kcal")), known = FOODS[w.toLowerCase()];
      if (!k && !known) { const kc = f.elements.kcal; if (kc) kc.focus(); return; }
      addFood(cap1(w) || "Food", k || known[0], !k && known ? known[1] : null); focus = "what";
    } else if (kind === "weight") {
      const v = +val("w"); if (!(v > 20)) return; addWeight(v); focus = "w";
    } else if (kind === "video") {
      const ti = val("title"); if (!ti) return;
      S.videos.push({ id: freshId = uid(), title: cap1(ti), client: val("client"), due: val("due"), stage: 0 }); changed("biz"); focus = "title";
    } else if (kind === "goal") {
      const n = val("name"), tg = +val("target"); if (!n || !(tg > 0)) return;
      S.goals.push({ id: freshId = uid(), name: cap1(n), cur: Math.max(0, +val("cur") || 0), target: tg }); changed("biz"); focus = "name";
    } else if (kind === "money") {
      const w = val("what"), a = Math.abs(+val("amt")); if (!w || !a) return;
      S.money.push({ id: freshId = uid(), what: cap1(w), amt: val("dir") === "in" ? a : -a, d: TODAY, biz: guessBiz(w) }); changed("money"); focus = "what";
    } else if (kind === "conn") {
      const name = f.dataset.conn, a = val("a"), b = val("b"); if (!a || (f.elements.b && !b)) return;
      const btn = f.querySelector(".btn"); btn.disabled = true; btn.textContent = "Connecting...";
      allie.connect(name, f.elements.b ? { a, b } : a, S.jobPrefs).then(r => { refresh("settings"); sayLive(r.ok ? "Connected, Jack." : "That didn't work. " + r.error); }); return;
    } else if (kind === "key") {
      const k = val("k"); allie.setKey(k).then(ok => { refresh("settings"); sayLive(ok ? "Got it. I'm all ears, Jack." : "Key removed. I'll stick to the basics."); }); return;
    } else if (kind === "jobs") {
      S.jobPrefs.what = val("what") || S.jobPrefs.what; S.jobPrefs.where = val("where") || S.jobPrefs.where; changed("jobs"); if (ON_PC) allie.refreshConn(S.jobPrefs);
    }
    const inp = focus && open[panel] && open[panel].querySelector(`form[data-form="${kind}"] [name="${focus}"]`);
    if (inp) inp.focus({ preventScroll: true });
  }
  for (const host of [world, sheetHost]) { host.addEventListener("click", panelClick); host.addEventListener("change", panelChange); host.addEventListener("submit", panelSubmit); }
  function setVoice(on) {
    voiceState.on = on; $$("[data-voice]").forEach(s => s.setAttribute("aria-checked", on));
    if (!on && srcNode) { srcNode.onended = null; try { srcNode.stop(); } catch (e) {} srcNode = null; level = 0; }
    try { localStorage.setItem("allie.voice", on ? "1" : "0"); } catch (e) {}
  }
  try { if (localStorage.getItem("allie.voice") === "0") setVoice(false); } catch (e) {}

  addEventListener("keydown", e => {
    if (e.key === "Escape") { if (busy) { stopTalking(); return; } if (!bar.hidden) { openChat(false); return; } if (open.settings) { closeSheet(); return; } if (HERE === "craft") { travel("studio"); return; } }
    if (e.target.matches("input,textarea,select")) return;
    if (e.key === "+" || e.key === "=") zoomBy(1.1);
    else if (e.key === "-") zoomBy(1 / 1.1);
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); stepTab(e.key === "ArrowRight" ? 1 : -1); }
    else if (e.key === "0") run("home");
    else if (e.key === "/" || (e.key === "Enter" && !e.target.closest("button,a[href],[role=button],[role=switch],[contenteditable]"))) { e.preventDefault(); openChat(true); }
  });

  /* ---------------- Live bits: the timer pill, the clock, the "now" line ---------------- */
  // While the work timer runs, its floating button shows the time instead of its name.
  const timerFloat = $('.float[data-cmd="time"] span');
  function island() {
    const on = !!S.timer; timerFloat.parentNode.classList.toggle("live", on);
    timerFloat.textContent = on ? "● " + clockOf(running()) : "timer"; timerFloat.parentNode._bw = 0;
  }
  let lastMin = -1;
  setInterval(() => {
    const now = new Date();
    if (S.timer) {
      const t = clockOf(running()), p = S.projects.find(x => x.id === S.timer.pid);
      timerFloat.textContent = "● " + t;
      $$('[data-live="timer"]').forEach(e => { e.textContent = t; });
      if (p) $$('[data-live="proj"]').forEach(e => { e.textContent = hm(projTotal(p, timeRange === "today" ? D0.getTime() : timeRange === "week" ? D0.getTime() - 6 * 864e5 : 0)); });
      $$('[data-live="today-time"]').forEach(e => { e.textContent = hm(dayTotal(TODAY)); });
    }
    if (now.getMinutes() !== lastMin) {
      lastMin = now.getMinutes();
      if (open.today && !open.today.contains(document.activeElement)) refresh("today");
    }
  }, 1000);

  /* ---------------- Light and dark ---------------- */
  function syncTheme() {
    if (open.settings) refresh("settings");
  }
  function applyTheme(t, keep) {
    root.dataset.theme = t; syncTheme(); if (ON_PC) allie.theme(t);
    if (keep) try { localStorage.setItem("allie.theme", t); } catch (e) {}
  }
  let savedTheme = null; try { savedTheme = localStorage.getItem("allie.theme"); } catch (e) {}
  applyTheme(savedTheme === "light" || savedTheme === "dark" ? savedTheme : root.dataset.theme === "light" ? "light" : "dark");
  new MutationObserver(syncTheme).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  function switchTheme(next, x, y) {
    if ((root.dataset.theme === "light" ? "light" : "dark") === next) return;
    if (!document.startViewTransition || reduce) return applyTheme(next, true);
    try {
      const vt = document.startViewTransition(() => applyTheme(next, true)), end = Math.hypot(Math.max(x, W - x), Math.max(y, H - y));
      vt.ready.then(() => root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
        { duration: 800, easing: "cubic-bezier(.45,0,.2,1)", pseudoElement: "::view-transition-new(root)" })).catch(() => {});
    } catch (err) { applyTheme(next, true); }
  }

  // First run: show the voice download in the top bar.
  if (DESK) {
    const chipS = document.createElement("span"); chipS.className = "chip setup"; chipS.hidden = true; $(".top").appendChild(chipS);
    chipS.addEventListener("click", e => { if (e.target.closest("[data-restart]")) allie.restart(); else if (e.target.closest("[data-later]")) chipS.hidden = true; });
    allie.onSetup(s => {
      const part = s.what === "asr" ? "Setting up my ears (1 of 2)" : "Setting up my voice (2 of 2)";
      if (s.stage === "download") { chipS.hidden = false; chipS.textContent = part + " · " + Math.round(s.progress * 100) + "%"; }
      else if (s.stage === "unpack") { chipS.hidden = false; chipS.textContent = part + " · unpacking"; }
      else if (s.stage === "voice") { chipS.hidden = true; }
      else if (s.stage === "ears") { startEars(); }
      else if (s.stage === "restart") { chipS.hidden = false; chipS.innerHTML = 'Update ready <button type="button" class="link" data-restart>Restart now</button> <button type="button" class="link" data-later>Later</button>'; }
      else if (s.stage === "error") { chipS.hidden = false; chipS.textContent = s.what === "voice" ? "Voice download failed · restart to retry" : "Couldn't start listening"; chipS.title = s.detail || ""; }
    });
  }
  sizeScene(); setHere("home"); goHome(true); island(); syncSleep(); restoreChat();
  const hr = new Date().getHours();
  reveal(`Good ${hr < 12 ? "morning" : hr < 18 ? "afternoon" : "evening"}, Jack. Just talk to me, or type below.`, 2.4, false);
  requestAnimationFrame(frame);
})();
</script>

</body></html>
